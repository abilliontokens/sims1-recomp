# DSOUND names proven in The Sims default.xbe (XDK 5233). Evidence: docs/dsound-symbols.md
# 33 of the 77 DSOUND target names (every [symbols] key of sdk/xdk/5558/signatures.toml with sec = "DSOUND").
# The other 44 have no code in this image, so they are correct zeros (doc sections 4 and 8).
# CDirectSoundStream IS linked here, unlike Fuzion Frenzy: 12 of its 21 names are below (doc section 1).
# Nothing is staged. Every name has a host body in sdk/runtime/xdk/dsound.cpp. The host DirectSoundCreateStream
# XDK_REQUIREs the two [data] stream vtables below. sdk/xdk/5233/layout.toml already holds the right
# CDirectSoundStream_Vtable = 0x0 and _Vtable2 = 0x4 for this build (constructor 0x1B6AD1).
# 0x1B5E6B, 0x1B6038, 0x1B608A and 0x1B60DC are reached only through jmp thunks, so the current recompiler inventory
# lacks them. sdk/tools/recomp/main.cpp makes every non-zero [symbols] address an entry point on the next run.
[symbols]
IDirectSound_Release                = 0x1B54E1
IDirectSoundBuffer_Release          = 0x1B54F7
CDirectSoundStream_AddRef           = 0x1B5C0F
CDirectSoundStream_Release          = 0x1B5C56
CDirectSoundStream_GetInfo          = 0x1B5CA4
CDirectSoundStream_Discontinuity    = 0x1B5D0B
